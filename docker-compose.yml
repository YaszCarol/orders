services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-app
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pipeline-network

  nginx:
    image: nginx:alpine
    container_name: orders-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pipeline-network

  mysql:
    image: mysql:8.0
    container_name: orders-mysql
    environment:
      MYSQL_DATABASE: order_pipeline
      MYSQL_USER: pipeline
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - pipeline-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: orders-rabbitmq
    hostname: orders-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pipeline-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-worker
    command: php artisan orders:consume
    volumes:
      - .:/var/www
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pipeline-network

volumes:
  mysql-data:
  rabbitmq-data:

networks:
  pipeline-network:
    driver: bridge
